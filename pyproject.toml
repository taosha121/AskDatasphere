[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "ask-datasphere"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "pymupdf>=1.24",
    "python-dotenv>=1.0",
    "modelscope>=1.15",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "rank-bm25>=0.3",
]

[project.optional-dependencies]
dev = ["ipykernel"]
eval = [
    "ragas>=0.2,<0.3",
    "langchain-anthropic<0.3",
    "langchain<0.4",
    "langchain-core<0.4",
    "langchain-community<0.4",
    "langchain-openai<0.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["rag*"]
